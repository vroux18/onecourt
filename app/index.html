<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OneCourt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>OneCourt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --a:#00e676; --a-dark:#04250f; --a-bg:#00e67612; --a-border:#00e67644;
  --bg:#07090b; --card:#10141788; --ink:#f2f5f2; --ink-soft:#79837f; --ink-dim:#5a635e;
  --chip-bg:#151a1d; --chip-border:#262d31; --chip-ink:#c9d1cd;
  --line:#232a2e; --track:#20262b; --ring-off:#3d454b;
  --warn:#ffb02e; --warn-bg:#ffb02e14; --warn-border:#ffb02e44;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Sora',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.45;
  padding-inline:22px;
  padding-block:calc(26px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
body.maplock{overflow:hidden}
::-webkit-scrollbar{display:none}
@keyframes ocdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
@keyframes ocpulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.glow{position:fixed;border-radius:50%;pointer-events:none;transition:background .5s;z-index:0}
#glow1{top:-100px;left:-60px;width:320px;height:320px;background:radial-gradient(circle,var(--g1),transparent 66%)}
#glow2{bottom:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,var(--g2),transparent 66%)}
.wrap{max-width:430px;margin:0 auto;position:relative;z-index:1}
/* ===== home ===== */
.homeview{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:calc(100dvh - 66px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;justify-content:center}
.home-brand{font-weight:800;font-size:34px;letter-spacing:-1px}
.home-brand .dot{color:var(--a)}
.home-date{font-weight:500;font-size:13px;color:var(--ink-soft);margin-top:6px;text-transform:capitalize}
.home-title{font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-1px;margin:26px 0 0}
.home-cards{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.home-card{display:flex;align-items:center;gap:14px;background:var(--card);backdrop-filter:blur(10px);border-radius:22px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.home-card .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.home-card .mid{flex:1;min-width:0}
.home-card .nm{font-weight:800;font-size:17px}
.home-card .ct{font-weight:600;font-size:11.5px;margin-top:2px}
.home-card .ar{font-weight:800;font-size:16px;flex:none}
.home-card.off{opacity:.65}
.home-sub{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:26px}
.home-days{display:flex;gap:8px;overflow-x:auto;margin-top:10px;margin-inline:-22px;padding:4px 22px;scrollbar-width:none}
.hday{flex:none;width:62px;background:#141619;border:1px solid var(--line);border-radius:16px;padding:10px 0;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.hday .dw{font-weight:600;font-size:10px;color:var(--ink-soft)}
.hday .n{font-weight:700;font-size:20px;line-height:1.2}
.hday.sel{background:var(--a);border-color:var(--a)}
.hday.sel .dw{color:color-mix(in srgb,var(--a-dark) 80%,transparent)}
.hday.sel .n{color:var(--a-dark);font-weight:800}
.home-foot{font-size:11px;color:var(--ink-dim);margin-top:26px;text-align:center}
.wordmark{cursor:pointer}
/* header */
.top{display:flex;justify-content:space-between;align-items:center}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.5px}
.wordmark .dot{color:var(--a);transition:color .4s}
.live{display:inline-flex;align-items:center;gap:7px;background:#12171acc;border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:99px;padding:6px 12px 6px 8px}
.live .halo{position:relative;width:16px;height:16px;border-radius:50%;background:var(--a-bg);display:inline-flex;align-items:center;justify-content:center}
.live .pt{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:ocdot 1.8s ease-in-out infinite}
.live .tag{font-weight:800;font-size:10px;letter-spacing:1px;color:var(--a)}
.live .hm{font-weight:600;font-size:10.5px;color:#8b968f;border-left:1px solid var(--line);padding-left:7px}
.live.stale .pt{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.live.stale .halo{background:var(--warn-bg)}
.live.stale .tag{color:var(--warn)}
/* segmented tabs */
.tabs{display:flex;gap:5px;margin-top:18px;background:#12171a;border:1px solid var(--line);border-radius:20px;padding:5px}
.tab{flex:1;background:transparent;border:none;border-radius:15px;padding:9px 0 7px;text-align:center;cursor:pointer;transition:background .3s;font-family:inherit}
.tab .lbl{font-weight:800;font-size:13px;color:var(--ink-soft)}
.tab .cnt{font-weight:600;font-size:9px;color:var(--ink-dim)}
.tab.on{background:var(--a)}
.tab.on .lbl{color:var(--a-dark)}
.tab.on .cnt{color:color-mix(in srgb,var(--a-dark) 80%,transparent)}
/* hero */
.hero{margin-top:20px;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-2px}
.hero .n{color:var(--a);transition:color .4s}
.hero .u{font-size:22px;letter-spacing:-.5px}
.herosub{font-weight:500;font-size:12px;color:var(--ink-soft);margin-top:5px}
/* days */
.days{display:flex;gap:10px;margin-top:18px;overflow-x:auto;margin-inline:-22px;padding:8px 22px;scrollbar-width:none}
.day{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;color:var(--ink)}
.day .ring{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .3s}
.day .core{width:44px;height:44px;border-radius:50%;background:#0d1114;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day .num{font-weight:800;font-size:15px;line-height:1;color:var(--ink)}
.day .cnt{font-weight:600;font-size:8px;color:var(--ink-dim);margin-top:1px}
.day .lbl{font-weight:700;font-size:10px;color:var(--ink-soft)}
.day.sel .num,.day.sel .lbl{color:var(--a)}
/* hour chips */
.hours{display:flex;gap:7px;margin-top:8px;overflow-x:auto;margin-inline:-22px;padding:8px 22px;align-items:center;scrollbar-width:none;position:sticky;top:0;z-index:30;background:var(--bg)}
.hchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:#12171a;border:1px solid var(--line);border-radius:16px;padding:9px 13px 7px;cursor:pointer;transition:background .25s;font-family:inherit}
.hchip .t{font-weight:600;font-size:13px;color:#e7efe9;white-space:nowrap}
.hchip.none .t{color:#4a534e}
.hchip .g{width:22px;height:3px;border-radius:2px;background:var(--track)}
.hchip.sel{background:var(--a);border-color:var(--a)}
.hchip.sel .t{font-weight:800;color:var(--a-dark)}
.hchip.sel .g{background:var(--a-dark)}
/* filters */
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-weight:600;font-size:12px;background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--chip-ink);border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer;font-family:inherit}
.chip.on{font-weight:700;background:var(--a);border-color:var(--a);color:var(--a-dark)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
/* list */
.meta-line{font-weight:500;font-size:11.5px;color:var(--ink-soft);margin-top:16px}
.clubs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.club{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:22px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.club-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.club-name{font-weight:700;font-size:16px}
.club-dist{font-weight:700;font-size:11px;color:var(--a);flex:none}
.club-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.bar{height:34px;border-radius:8px;margin-top:14px;position:relative}
.bar span{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:12px;white-space:nowrap}
.ticks{display:flex;justify-content:space-between;margin-top:5px;font-weight:600;font-size:9.5px;color:var(--ink-dim)}
.club-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.club-foot .n{font-weight:700;font-size:11.5px;color:var(--chip-ink);flex:1}
.club-foot .bike{font-weight:700;font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
.club-foot .go{font-weight:800;font-size:11px;color:var(--a);white-space:nowrap}
/* empty states */
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px}
.empty .reset{color:var(--a);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;font-size:13px;padding:0}
.bigcard{margin-top:32px;text-align:center;padding:36px 24px;background:var(--card);border:1px dashed #2a3236;border-radius:24px}
.bigcard .ico{width:56px;height:56px;border-radius:50%;background:var(--a-bg);border:1px solid var(--a-border);margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--a)}
.bigcard .h{font-weight:700;font-size:16px;margin-top:14px;color:var(--ink)}
.bigcard .p{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
/* ===== map view ===== */
.mapview{position:fixed;inset:0;background:#0a0e10;display:flex;flex-direction:column;z-index:60}
.mapcanvas{flex:1;position:relative;overflow:hidden;background:#0d1214}
.mapcanvas .grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 38px,#141b1f 38px 39px),repeating-linear-gradient(90deg,transparent 0 38px,#141b1f 38px 39px)}
.mapcanvas .seine{position:absolute;left:-10%;top:30%;width:80%;height:60px;background:#0f2a33;transform:rotate(-14deg);border-radius:40px;opacity:.8}
.mapcanvas .park1{position:absolute;right:-8%;top:8%;width:180px;height:130px;background:radial-gradient(ellipse,#12331f,transparent 72%)}
.mapcanvas .park2{position:absolute;left:6%;bottom:6%;width:150px;height:110px;background:radial-gradient(ellipse,#12331f,transparent 72%)}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;z-index:2}
.pin .b{width:32px;height:32px;border-radius:50%;background:#161c20;border:2px solid #2a3236;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--chip-ink)}
.pin.sel{z-index:3}
.pin.sel .b{width:42px;height:42px;background:var(--a);border-color:#fff;color:var(--a-dark);animation:ocpulse 2s infinite}
.pin .nm{font-weight:700;font-size:10px;background:#0d1114ee;border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap;color:var(--ink)}
.mapback{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:20px;font-weight:700;font-size:12px;background:#0d1114ee;border:1px solid var(--line);border-radius:99px;padding:9px 15px;cursor:pointer;color:var(--ink);font-family:inherit;z-index:4}
.mapdist{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:20px;font-weight:700;font-size:11px;color:var(--a);background:#0d1114ee;border:1px solid var(--line);border-radius:99px;padding:9px 13px;z-index:4}
/* bottom sheet */
.sheet{background:#10171a;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 22px calc(26px + env(safe-area-inset-bottom,0px));max-height:52%;overflow-y:auto}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#2a3236;margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sheet-name{font-weight:800;font-size:16px}
.sheet-dist{font-weight:700;font-size:11.5px;color:var(--a);flex:none}
.sheet-meta{font-size:10.5px;color:var(--ink-dim);margin-top:3px}
/* directions — rangée centrée flottant au-dessus du bandeau */
.modesbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;justify-content:center;z-index:4;width:max-content;max-width:calc(100% - 32px)}
.mode{display:flex;align-items:center;gap:6px;background:#0d1114ee;border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:99px;padding:8px 13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.mode .ic{font-size:13px}
.mode .tm{font-weight:800;font-size:11.5px}
.gmaps{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;background:var(--a);color:var(--a-dark);border-radius:14px;padding:11px;font-weight:800;font-size:12.5px;text-decoration:none}
.geo-hint{font-size:10.5px;color:var(--ink-dim);margin-top:8px}
.rows{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.row{display:flex;align-items:center;gap:12px}
.row .t{font-weight:800;font-size:14px;color:var(--a);width:44px;flex:none}
.row .mid{flex:1;min-width:0}
.row .lab{font-weight:600;font-size:12.5px}
.row .sub{font-size:10.5px;color:var(--ink-soft)}
.row .pr{font-weight:700;font-size:12.5px;color:var(--chip-ink);flex:none}
.row .book{font-weight:800;font-size:11px;background:var(--a);color:var(--a-dark);border-radius:99px;padding:8px 13px;white-space:nowrap;text-decoration:none;flex:none}
.sheet-note{font-size:10px;color:var(--ink-dim);margin-top:12px}
/* origine (géoloc / adresse) */
.originbtn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:6px;background:#12171add;border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:99px;padding:10px 14px;font-weight:700;font-size:11.5px;color:var(--ink);cursor:pointer;font-family:inherit;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.originpanel{position:fixed;inset:0;z-index:70;background:#000a;display:flex;flex-direction:column;justify-content:flex-end}
.originsheet{background:#10171a;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.originsheet .grab{width:38px;height:4px;border-radius:2px;background:#2a3236;margin:0 auto 14px}
.originsheet h2{font-weight:800;font-size:17px;margin:0}
.origin-geo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:var(--a);color:var(--a-dark);border:none;border-radius:14px;padding:12px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;width:100%}
.origin-row{display:flex;gap:8px;margin-top:10px}
.origin-row input{flex:1;min-width:0;background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:14px;padding:12px 14px;color:var(--ink);font-family:inherit;font-size:13px}
.origin-row input::placeholder{color:var(--ink-dim)}
.origin-row button{background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:14px;padding:12px 16px;color:var(--ink);font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.origin-hint{font-size:10.5px;color:var(--ink-dim);margin-top:10px}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style>
</head><body>
<div class="glow" id="glow1"></div>
<div class="glow" id="glow2"></div>
<div class="homeview" id="homeview" hidden>
  <div class="home-brand">onecourt<span class="dot">.</span></div>
  <div class="home-date" id="homeDate"></div>
  <h1 class="home-title">Ça joue où ?</h1>
  <div class="home-cards" id="homeCards"></div>
  <div class="home-sub">Prochains jours</div>
  <div class="home-days" id="homeDays"></div>
  <div class="home-foot" id="homeFoot"></div>
</div>
<div class="wrap" id="app">
  <div class="top">
    <span class="wordmark">onecourt<span class="dot">.</span></span>
    <span class="live" id="live" hidden><span class="halo"><span class="pt"></span></span><span class="tag" id="liveTag">LIVE</span><span class="hm" id="liveHm"></span></span>
  </div>
  <nav class="tabs" aria-label="Choix du sport">
    <button class="tab on" type="button" data-sport="tennis"><div class="lbl">Tennis</div><div class="cnt" id="cnt-tennis">—</div></button>
    <button class="tab" type="button" data-sport="padel"><div class="lbl">Padel</div><div class="cnt" id="cnt-padel">—</div></button>
    <button class="tab" type="button" data-sport="foot"><div class="lbl">Foot</div><div class="cnt" id="cnt-foot">—</div></button>
  </nav>
  <div class="hero" id="hero"></div>
  <div class="herosub" id="herosub"></div>
  <nav class="days" id="days" aria-label="Choix du jour"></nav>
  <nav class="hours" id="hours" aria-label="Choix de l'heure"></nav>
  <div class="filters" id="filters">
    <button class="chip" id="fNear" type="button">📍 Le plus proche</button>
    <button class="chip" id="fCov" type="button">Couvert</button>
  </div>
  <div class="meta-line" id="metaLine"></div>
  <main id="list" class="clubs"></main>
</div>
<button class="originbtn" id="originbtn" type="button">📍 Ma position</button>
<div class="originpanel" id="originpanel" hidden>
  <div class="originsheet">
    <div class="grab"></div>
    <h2>D’où pars-tu ?</h2>
    <button class="origin-geo" id="originGeo" type="button">📍 Me géolocaliser</button>
    <div class="origin-row">
      <input id="originInput" type="text" placeholder="Ou entre une adresse…" autocomplete="street-address">
      <button id="originOk" type="button">OK</button>
    </div>
    <div class="origin-hint" id="originHint">Les distances et temps de trajet seront calculés depuis ce point.</div>
  </div>
</div>
<div class="mapview" id="mapview" hidden>
  <div class="mapcanvas" id="mapcanvas">
    <div class="grid"></div><div class="seine"></div><div class="park1"></div><div class="park2"></div>
    <div id="pins"></div>
    <button class="mapback" type="button" id="mapback">← Retour</button>
    <span class="mapdist" id="mapdistTop"></span>
    <div class="modesbar" id="modesbar"></div>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<script>
(function(){
'use strict';
var DS={tennis:null,padel:null,foot:null};
var state={view:'home',day:null,sport:'tennis',hour:null,near:false,cov:false,mapClub:null};
var SPORTMETA={tennis:{label:'Tennis',emoji:'🎾'},padel:{label:'Padel',emoji:'🏓'},foot:{label:'Foot',emoji:'⚽'}};
var homeDay=null;
var pos=null,posTried=false,origin={src:null,label:null};
var DOW=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
var DOWU=['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
var MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var RESA_TENNIS='https://tennis.paris.fr/tennis/jsp/site/Portal.jsp?page=recherche&view=recherche_creneau';
var A={
  tennis:{a:'#00e676',dark:'#04250f',bg:'#00e67612',border:'#00e67644',g1:'#00e67655',g2:'#c6ff4e2a'},
  padel:{a:'#a855f7',dark:'#26063a',bg:'#a855f712',border:'#a855f744',g1:'#a855f755',g2:'#d8b4fe2a'},
  foot:{a:'#00c2ff',dark:'#03222e',bg:'#00c2ff12',border:'#00c2ff44',g1:'#00c2ff55',g2:'#7cd8ff2a'}
};

/* ---- géoloc + distances ---- */
function haversine(lat1,lng1,lat2,lng2){
  var R=6371,rad=Math.PI/180;
  var dLat=(lat2-lat1)*rad,dLng=(lng2-lng1)*rad;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
function siteLng(site){return site.lng!=null?site.lng:site.lon;}
function siteKm(site){
  if(!pos||!site.lat||siteLng(site)==null)return null;
  return haversine(pos.lat,pos.lng,site.lat,siteLng(site));
}
function fmtKm(km){
  if(km==null)return null;
  return km<1?Math.round(km*100)*10+' m':(Math.round(km*10)/10).toLocaleString('fr-FR')+' km';
}
function fmtMin(min){
  if(min>=60){var h=Math.floor(min/60);return h+' h '+(Math.round(min-h*60)||'')+(min%60?' min':'');}
  return Math.round(min)+' min';
}
/* durées estimées à vol d'oiseau corrigé (pas un vrai routage) */
function modeTimes(km){
  if(km==null)return null;
  return {
    walk:fmtMin(km*1.25/4.7*60),
    bike:fmtMin(km*1.3/14*60),
    transit:fmtMin(km<1?km*1.25/4.7*60:8+km*1.2/22*60)
  };
}
function requestPos(cb){
  if(pos||posTried&&!navigator.geolocation)return cb&&cb();
  if(!navigator.geolocation){posTried=true;return cb&&cb();}
  navigator.geolocation.getCurrentPosition(function(p){
    pos={lat:p.coords.latitude,lng:p.coords.longitude};origin={src:'geo',label:'Ma position'};posTried=true;cb&&cb();
  },function(){posTried=true;cb&&cb();},{maximumAge:600000,timeout:8000});
}
function geocode(q,cb){
  fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(q)+'&limit=1')
    .then(function(r){return r.json();})
    .then(function(j){
      var f=j.features&&j.features[0];
      if(!f)return cb(null);
      cb({lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],label:f.properties.label});
    }).catch(function(){cb(null);});
}
function gmapsUrl(site,mode){
  var u='https://www.google.com/maps/dir/?api=1&destination='+site.lat+','+siteLng(site);
  if(mode)u+='&travelmode='+mode;
  return u;
}

/* ---- filtres ---- */
function filteredSlots(day,ignoreHour){
  var out=[],D=ds();if(!D)return out;
  (D.slots[day]||[]).forEach(function(s){
    if(state.cov && !s.cov)return;
    if(!ignoreHour && state.hour!=null && s.h!==state.hour)return;
    out.push(s);
  });
  return out;
}

function siteAgg(){
  var D=ds(),slots=filteredSlots(state.day),bySite={};
  slots.forEach(function(s){(bySite[s.s]=bySite[s.s]||[]).push(s);});
  var ids=Object.keys(bySite).map(Number);
  ids.sort(function(a,b){
    if(state.near){
      var ka=siteKm(D.sites[a]),kb=siteKm(D.sites[b]);
      if(ka!=null&&kb!=null)return ka-kb;
    }
    var Aa=D.sites[a],Bb=D.sites[b];
    return (Aa.arr-Bb.arr)||Aa.name.localeCompare(Bb.name);
  });
  return {ids:ids,bySite:bySite,total:slots.length};
}

function distLabel(site){
  var km=siteKm(site);
  if(km!=null)return fmtKm(km);
  return site.arr>0&&site.arr<=20?site.arr+'ᵉ':'Hors Paris';
}

    var sk=Object.keys(surfs);if(sk.length)bits.push(sk.join(' / '));

    else{bt.style.left='calc('+a+'% + 10px)';bt.style.color='var(--a-dark)';}

    var kmc=siteKm(site);

    foot.appendChild(el('span','go','Voir sur la carte →'));

function renderMap(){
  var mv=document.getElementById('mapview');
  var open=state.mapClub!=null&&ds();
  mv.hidden=!open;
  document.body.classList.toggle('maplock',!!open);
  if(!open)return;
  var D=ds(),agg=siteAgg();
  if(agg.ids.indexOf(state.mapClub)<0){state.mapClub=agg.ids[0];}
  var selId=state.mapClub,selSite=D.sites[selId];
  // pins : projection des lat/lng sur la zone
  var pinsHost=document.getElementById('pins');pinsHost.textContent='';
  var lats=agg.ids.map(function(i){return D.sites[i].lat;}).filter(Boolean);
  var lngs=agg.ids.map(function(i){return siteLng(D.sites[i]);}).filter(Boolean);
  var la0=Math.min.apply(null,lats),la1=Math.max.apply(null,lats);
  var lo0=Math.min.apply(null,lngs),lo1=Math.max.apply(null,lngs);
  var dla=Math.max(la1-la0,0.005),dlo=Math.max(lo1-lo0,0.005);
  agg.ids.forEach(function(sid){
    var site=D.sites[sid];if(!site.lat||siteLng(site)==null)return;
    var x=12+((siteLng(site)-lo0)/dlo)*76;
    var y=14+((la1-site.lat)/dla)*66;
    var sel=sid===selId;
    var p=el('button','pin'+(sel?' sel':''));p.type='button';
    p.style.left=x+'%';p.style.top=y+'%';
    p.appendChild(el('span','b',String(agg.bySite[sid].length)));
    if(sel)p.appendChild(el('span','nm',site.name));
    p.addEventListener('click',function(){state.mapClub=sid;renderMap();});
    pinsHost.appendChild(p);
  });
  document.getElementById('mapdistTop').textContent=distLabel(selSite);
  // bottom sheet
  var sheet=document.getElementById('sheet');sheet.textContent='';
  sheet.appendChild(el('div','grab'));
  // trajets : rangée centrée au-dessus du bandeau
  var modes=document.getElementById('modesbar');modes.textContent='';
  var km=siteKm(selSite),times=modeTimes(km);
  [['walk','🚶','walking'],['bike','🚴','bicycling'],['transit','🚇','transit']].forEach(function(m){
    var a=el('a','mode');
    a.href=gmapsUrl(selSite,m[2]);a.target='_blank';a.rel='noopener';
    a.appendChild(el('span','ic',m[1]));
    a.appendChild(el('span','tm',times?times[m[0]]:'—'));
    modes.appendChild(a);
  });
  // créneaux d'abord, groupés par heure
  var rows=el('div','rows');rows.style.marginTop='0';
  var ss=agg.bySite[selId],byHour={};
  ss.forEach(function(s){(byHour[s.h]=byHour[s.h]||[]).push(s);});
  var isPadel=state.sport==='padel';
  Object.keys(byHour).map(Number).sort(function(x,y){return x-y;}).forEach(function(h){
    var grp=byHour[h];
    var row=el('div','row');
    row.appendChild(el('span','t',h+'h'));
    var mid=el('div','mid');
    mid.appendChild(el('div','lab',grp.length+(isPadel?(grp.length>1?' créneaux':' créneau'):(grp.length>1?' courts libres':' court libre'))));
    var metas={};grp.forEach(function(s){var m=isPadel?s.c:(s.surf||'').toLowerCase();if(m)metas[m]=1;});
    var mtxt=Object.keys(metas).join(' / ');
    mid.appendChild(el('div','sub',isPadel?mtxt:mtxt+(mtxt?' · ':'')+'1h'));
    row.appendChild(mid);
    var prices=grp.map(function(s){return parseFloat(String(s.p).replace(',','.'));}).filter(function(x){return !isNaN(x);});
    var ptxt='';
    if(prices.length){
      var pmin=Math.min.apply(null,prices);
      ptxt=(prices.some(function(x){return x!==pmin;})?'dès ':'')+pmin+' €';
    }
    row.appendChild(el('span','pr',ptxt));
    var bk=el('a','book','Réserver');
    bk.href=selSite.url||RESA_TENNIS;bk.target='_blank';bk.rel='noopener';
    row.appendChild(bk);
    rows.appendChild(row);
  });
  sheet.appendChild(rows);
  // nom du terrain + adresse en dessous de la liste
  var head=el('div','sheet-head');
  head.appendChild(el('span','sheet-name',selSite.name));
  head.appendChild(el('span','sheet-dist',distLabel(selSite)));
  sheet.appendChild(head);
  sheet.appendChild(el('div','sheet-meta',(selSite.adresse||'')+(selSite.cp?' · '+selSite.cp:'')));
  var g=el('a','gmaps','Ouvrir dans Google Maps ↗');
  g.href=gmapsUrl(selSite,null);g.target='_blank';g.rel='noopener';
  sheet.appendChild(g);
  if(!pos){
    sheet.appendChild(el('div','geo-hint',posTried
      ?'Position indisponible — les temps de trajet s’afficheront si tu autorises la localisation.'
      :'Autorise la localisation pour voir les temps de trajet.'));
  }
  sheet.appendChild(el('div','sheet-note',NOTE[state.sport]||''));
}

  if(e.key==='Enter')document.getElementById('originOk').click();
});
document.getElementById('fNear').addEventListener('click',function(){
  state.near=!state.near;
  if(state.near&&!pos)requestPos(function(){render();});
  render();
});
document.getElementById('fCov').addEventListener('click',function(){state.cov=!state.cov;render();});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){switchSport(b.getAttribute('data-sport'));});
});

if('serviceWorker' in navigator){
  try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
}

function loadJSON(path){return fetch(path,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

Promise.all([loadJSON('data.json'),loadJSON('padel.json'),loadJSON('foot.json')]).then(function(res){
  DS.tennis=res[0];DS.padel=res[1];DS.foot=res[2];
  if(!DS[state.sport]&&state.sport!=='foot')state.sport='tennis';
  var D=ds();
  state.day=D?(D.days.find(function(day){return (D.slots[day]||[]).length>0;})||D.days[0]):null;
  render();
  // géoloc en tâche de fond pour afficher les distances sur les cartes
  requestPos(function(){if(pos)render();});
});
})();
</script>
</body></html>
