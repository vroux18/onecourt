<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OneCourt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>OneCourt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --a:#00e676; --a-dark:#04250f; --a-bg:#00e67612; --a-border:#00e67644;
  --bg:#07090b; --card:#10141788; --ink:#f2f5f2; --ink-soft:#79837f; --ink-dim:#5a635e;
  --chip-bg:#151a1d; --chip-border:#262d31; --chip-ink:#c9d1cd;
  --line:#232a2e; --track:#20262b; --ring-off:#3d454b;
  --warn:#ffb02e; --warn-bg:#ffb02e14; --warn-border:#ffb02e44;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Sora',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.45;
  padding-inline:22px;
  padding-block:calc(26px + env(safe-area-inset-top,0px)) calc(130px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
::-webkit-scrollbar{display:none}
.glow{position:fixed;border-radius:50%;pointer-events:none;transition:background .5s;z-index:0}
#glow1{top:-100px;left:-60px;width:320px;height:320px;background:radial-gradient(circle,var(--g1),transparent 66%)}
#glow2{bottom:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,var(--g2),transparent 66%)}
.wrap{max-width:430px;margin:0 auto;position:relative;z-index:1}
/* header */
.top{display:flex;justify-content:space-between;align-items:center}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.5px}
.wordmark .dot{color:var(--a);transition:color .4s}
.maj{font-weight:700;font-size:10.5px;color:var(--a);border:1px solid var(--a-border);border-radius:99px;padding:5px 11px;background:var(--a-bg);white-space:nowrap}
.maj.stale{color:var(--warn);border-color:var(--warn-border);background:var(--warn-bg)}
/* hero */
.hero{margin-top:20px;font-weight:800;font-size:36px;line-height:1.15;letter-spacing:-1.5px}
.hero .n{color:var(--a);transition:color .4s}
/* days */
.days{display:flex;gap:10px;margin-top:20px;overflow-x:auto;margin-inline:-22px;padding:8px 22px;scrollbar-width:none}
.day{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;color:var(--ink)}
.day .ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .3s}
.day .core{width:46px;height:46px;border-radius:50%;background:#0d1114;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day .num{font-weight:800;font-size:16px;line-height:1;color:var(--ink)}
.day .cnt{font-weight:600;font-size:8px;color:var(--ink-dim);margin-top:1px}
.day .lbl{font-weight:700;font-size:10px;color:var(--ink-soft)}
.day.sel .num,.day.sel .lbl{color:var(--a)}
/* filters */
.filters{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-weight:600;font-size:12px;background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--chip-ink);border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer;font-family:inherit}
.chip.on{font-weight:700;background:var(--a);border-color:var(--a);color:var(--a-dark)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
/* list */
.meta-line{font-weight:500;font-size:11.5px;color:var(--ink-soft);margin-top:18px}
.clubs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.club{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:22px;padding:16px;cursor:pointer;transition:border-color .3s;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.club.open{border-color:color-mix(in srgb,var(--a) 33%,transparent)}
.club-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.club-name{font-weight:700;font-size:16px}
.club-arr{font-weight:700;font-size:11px;color:var(--a);flex:none}
.club-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.bar{height:34px;border-radius:8px;margin-top:14px;position:relative}
.bar span{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:12px;color:var(--a-dark);white-space:nowrap}
.ticks{display:flex;justify-content:space-between;margin-top:5px;font-weight:600;font-size:9.5px;color:var(--ink-dim)}
.detail{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.row{display:flex;align-items:center;gap:12px}
.row .t{font-weight:800;font-size:14px;color:var(--a);width:44px;flex:none}
.row .mid{flex:1;min-width:0}
.row .lab{font-weight:600;font-size:12.5px}
.row .sub{font-size:10.5px;color:var(--ink-soft)}
.row .pr{font-weight:700;font-size:12.5px;color:var(--chip-ink);flex:none}
.row .book{font-weight:800;font-size:11px;background:var(--a);color:var(--a-dark);border-radius:99px;padding:7px 12px;white-space:nowrap;text-decoration:none;flex:none}
.book-note{font-size:10px;color:var(--ink-dim);margin-top:2px}
/* empty states */
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px}
.empty .reset{color:var(--a);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;font-size:13px;padding:0}
.bigcard{margin-top:32px;text-align:center;padding:36px 24px;background:var(--card);border:1px dashed #2a3236;border-radius:24px}
.bigcard .ico{width:56px;height:56px;border-radius:50%;background:var(--a-bg);border:1px solid var(--a-border);margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--a)}
.bigcard .h{font-weight:700;font-size:16px;margin-top:14px;color:var(--ink)}
.bigcard .p{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
/* tab bar */
.tabbar{
  position:fixed;left:22px;right:22px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;
  display:flex;gap:6px;background:#12171add;border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;padding:6px;
  max-width:430px;margin:0 auto;
}
.tab{flex:1;background:transparent;border:none;border-radius:17px;padding:9px 0 8px;text-align:center;cursor:pointer;transition:background .3s;font-family:inherit}
.tab .lbl{font-weight:800;font-size:12.5px;color:var(--ink-soft)}
.tab .cnt{font-weight:600;font-size:9px;color:var(--ink-dim)}
.tab.on{background:var(--a)}
.tab.on .lbl{color:var(--a-dark)}
.tab.on .cnt{color:color-mix(in srgb,var(--a-dark) 80%,transparent)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style>
</head><body>
<div class="glow" id="glow1"></div>
<div class="glow" id="glow2"></div>
<div class="wrap">
  <div class="top">
    <span class="wordmark">onecourt<span class="dot">.</span></span>
    <span class="maj" id="maj" hidden></span>
  </div>
  <div class="hero" id="hero"></div>
  <nav class="days" id="days" aria-label="Choix du jour"></nav>
  <div class="filters" id="filters">
    <select class="chip" id="fArr" aria-label="Arrondissement"><option value="">Tous les arr.</option></select>
    <button class="chip" id="fCov" type="button">Couvert</button>
    <button class="chip" id="fSoir" type="button">Soir 18h+</button>
  </div>
  <div class="meta-line" id="metaLine"></div>
  <main id="list" class="clubs"></main>
</div>
<nav class="tabbar" aria-label="Choix du sport">
  <button class="tab on" type="button" data-sport="tennis"><div class="lbl">Tennis</div><div class="cnt" id="cnt-tennis">—</div></button>
  <button class="tab" type="button" data-sport="padel"><div class="lbl">Padel</div><div class="cnt" id="cnt-padel">—</div></button>
  <button class="tab" type="button" data-sport="foot"><div class="lbl">Foot</div><div class="cnt" id="cnt-foot">—</div></button>
</nav>
<script>
(function(){
'use strict';
var DS={tennis:null,padel:null,foot:null};
var state={day:null,sport:'tennis',arr:'',cov:false,soir:false,open:null};
var DOW=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
var DOWU=['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
var RESA_TENNIS='https://tennis.paris.fr/tennis/jsp/site/Portal.jsp?page=recherche&view=recherche_creneau';
var A={
  tennis:{a:'#00e676',dark:'#04250f',bg:'#00e67612',border:'#00e67644',g1:'#00e67655',g2:'#c6ff4e2a'},
  padel:{a:'#00c2ff',dark:'#03222e',bg:'#00c2ff12',border:'#00c2ff44',g1:'#00c2ff55',g2:'#7cd8ff2a'},
  foot:{a:'#ffb02e',dark:'#2b1c03',bg:'#ffb02e12',border:'#ffb02e44',g1:'#ffb02e44',g2:'#ffd68a22'}
};
var NOTE={tennis:'Réservation sur tennis.paris.fr — compte Mon Paris requis.',
  padel:'Réservation via Anybuddy — prix par piste.'};

try{var saved=JSON.parse(localStorage.getItem('onecourt')||'{}');
  ['arr','cov','soir','sport'].forEach(function(k){if(k in saved)state[k]=saved[k];});
}catch(e){}
function persist(){try{localStorage.setItem('onecourt',JSON.stringify({arr:state.arr,cov:state.cov,soir:state.soir,sport:state.sport}));}catch(e){}}

function ds(){return DS[state.sport];}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function applyAccent(){
  var c=A[state.sport],r=document.documentElement.style;
  r.setProperty('--a',c.a);r.setProperty('--a-dark',c.dark);
  r.setProperty('--a-bg',c.bg);r.setProperty('--a-border',c.border);
  r.setProperty('--g1',c.g1);r.setProperty('--g2',c.g2);
}

function filteredSlots(day){
  var out=[],D=ds();if(!D)return out;
  (D.slots[day]||[]).forEach(function(s){
    var site=D.sites[s.s];
    if(state.arr!=='' && String(site.arr)!==state.arr)return;
    if(state.cov && !s.cov)return;
    if(state.soir && s.h<18)return;
    out.push(s);
  });
  return out;
}

function renderMaj(){
  var m=document.getElementById('maj');
  var D=ds();
  if(!D||!D.generated_at){m.hidden=true;return;}
  var gen=new Date(D.generated_at);
  var hrs=(Date.now()-gen.getTime())/36e5;
  var hm=gen.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  m.hidden=false;
  m.classList.toggle('stale',hrs>30);
  m.textContent=hrs>30?'● données anciennes':'● maj '+hm;
}

function renderHero(){
  var h=document.getElementById('hero');h.textContent='';
  var D=ds();
  if(!D){
    h.appendChild(el('span','n','Foot'));
    h.appendChild(document.createElement('br'));
    h.appendChild(document.createTextNode('pas encore dispo'));
    return;
  }
  var n=filteredSlots(state.day).length;
  var d=new Date(state.day+'T12:00:00');
  var today=new Date();
  var isToday=d.toDateString()===today.toDateString();
  h.appendChild(el('span','n',n+' créneaux'));
  h.appendChild(document.createElement('br'));
  h.appendChild(document.createTextNode(isToday?'libres aujourd’hui':'libres '+DOW[d.getDay()]+' '+d.getDate()));
}

function renderDays(){
  var nav=document.getElementById('days');nav.textContent='';
  var D=ds();if(!D)return;
  var counts=D.days.map(function(day){return filteredSlots(day).length;});
  var max=Math.max.apply(null,counts.concat([1]));
  D.days.forEach(function(day,i){
    var n=counts[i];
    var sel=day===state.day;
    var r=Math.round(n/max*100);
    var b=el('button','day'+(sel?' sel':''));b.type='button';
    var ring=el('div','ring');
    var on=sel?'var(--a)':'var(--ring-off)';
    ring.style.background='conic-gradient('+on+' 0 '+r+'%, var(--track) '+r+'% 100%)';
    var core=el('div','core');
    var d=new Date(day+'T12:00:00');
    core.appendChild(el('span','num',String(d.getDate())));
    core.appendChild(el('span','cnt',n>0?String(n):'—'));
    ring.appendChild(core);
    b.appendChild(ring);
    b.appendChild(el('span','lbl',DOWU[d.getDay()]));
    b.addEventListener('click',function(){state.day=day;state.open=null;render();});
    nav.appendChild(b);
  });
}

function renderList(){
  var list=document.getElementById('list');list.textContent='';
  var meta=document.getElementById('metaLine');meta.textContent='';
  var D=ds();
  if(!D){
    if(state.sport==='foot'){
      var bc=el('div','bigcard');
      bc.appendChild(el('div','ico','⋯'));
      bc.appendChild(el('div','h','Le foot arrive bientôt'));
      bc.appendChild(el('div','p','Pas encore de source ouverte pour les terrains de foot à Paris. On te préviendra dès que c’est dispo.'));
      list.appendChild(bc);
    }else{
      var bc2=el('div','bigcard');
      bc2.appendChild(el('div','ico','!'));
      bc2.appendChild(el('div','h','Données indisponibles'));
      bc2.appendChild(el('div','p','Le fichier de créneaux n’a pas pu être chargé. Réessaye plus tard.'));
      list.appendChild(bc2);
    }
    return;
  }
  var slots=filteredSlots(state.day);
  if(!slots.length){
    var em=el('div','empty');
    em.appendChild(document.createTextNode('Aucun créneau avec ces filtres.'));
    em.appendChild(document.createElement('br'));
    var rst=el('button','reset','Réinitialiser');rst.type='button';
    rst.addEventListener('click',function(){state.arr='';state.cov=false;state.soir=false;render();});
    em.appendChild(rst);
    list.appendChild(em);
    return;
  }
  var bySite={};
  slots.forEach(function(s){(bySite[s.s]=bySite[s.s]||[]).push(s);});
  var siteIds=Object.keys(bySite).map(Number).sort(function(a,b){
    var Aa=D.sites[a],Bb=D.sites[b];
    return (Aa.arr-Bb.arr)||Aa.name.localeCompare(Bb.name);
  });
  meta.textContent=slots.length+' créneaux · '+siteIds.length+' sites';
  siteIds.forEach(function(sid){
    var site=D.sites[sid];
    var ss=bySite[sid];
    var open=state.open===sid;
    var card=el('section','club'+(open?' open':''));
    card.tabIndex=0;card.setAttribute('role','button');
    var head=el('div','club-head');
    head.appendChild(el('span','club-name',site.name));
    head.appendChild(el('span','club-arr',site.arr>0&&site.arr<=20?site.arr+'ᵉ':'Hors Paris'));
    card.appendChild(head);
    var surfs={};ss.forEach(function(s){if(s.surf&&s.surf!=='Padel')surfs[s.surf.toLowerCase()]=1;});
    var bits=[site.adresse||''];
    var sk=Object.keys(surfs);if(sk.length)bits.push(sk.join(' / '));
    if(ss.some(function(s){return s.cov;}))bits.push('couvert');
    if(ss.some(function(s){return s.ecl;}))bits.push('éclairé');
    card.appendChild(el('div','club-meta',bits.filter(Boolean).join(' · ')));
    // availability bar 8h→22h
    var hrs=ss.map(function(s){return s.h;});
    var min=Math.min.apply(null,hrs),max=Math.max.apply(null,hrs)+1;
    var a=Math.max(0,(min-8)/14*100),b=Math.min(100,(max-8)/14*100);
    var bar=el('div','bar');
    bar.style.background='linear-gradient(90deg,var(--track) 0 '+a+'%, var(--a) '+a+'% '+b+'%, var(--track) '+b+'% 100%)';
    var bt=el('span',null,min+'h – '+max+'h');
    bt.style.left='calc('+a+'% + 10px)';
    bar.appendChild(bt);
    card.appendChild(bar);
    var ticks=el('div','ticks');
    ['8h','12h','16h','20h','22h'].forEach(function(t){ticks.appendChild(el('span',null,t));});
    card.appendChild(ticks);
    if(open){
      var det=el('div','detail');
      var byHour={};
      ss.forEach(function(s){(byHour[s.h]=byHour[s.h]||[]).push(s);});
      Object.keys(byHour).map(Number).sort(function(x,y){return x-y;}).forEach(function(h){
        var grp=byHour[h];
        var row=el('div','row');
        row.appendChild(el('span','t',h+'h'));
        var mid=el('div','mid');
        var isPadel=state.sport==='padel';
        mid.appendChild(el('div','lab',grp.length+(isPadel?(grp.length>1?' créneaux':' créneau'):(grp.length>1?' courts libres':' court libre'))));
        var metas={};grp.forEach(function(s){var m=isPadel?s.c:(s.surf||'').toLowerCase();if(m)metas[m]=1;});
        var mtxt=Object.keys(metas).join(' / ');
        mid.appendChild(el('div','sub',isPadel?mtxt:mtxt+(mtxt?' · ':'')+'1h'));
        row.appendChild(mid);
        var prices=grp.map(function(s){return parseFloat(String(s.p).replace(',','.'));}).filter(function(x){return !isNaN(x);});
        var ptxt='';
        if(prices.length){
          var pmin=Math.min.apply(null,prices);
          ptxt=(prices.some(function(x){return x!==pmin;})?'dès ':'')+pmin+' €';
        }
        row.appendChild(el('span','pr',ptxt));
        var bk=el('a','book','Réserver');
        bk.href=site.url||RESA_TENNIS;bk.target='_blank';bk.rel='noopener';
        bk.addEventListener('click',function(e){e.stopPropagation();});
        row.appendChild(bk);
        det.appendChild(row);
      });
      det.appendChild(el('div','book-note',NOTE[state.sport]||''));
      card.appendChild(det);
    }
    function toggle(){state.open=open?null:sid;render();}
    card.addEventListener('click',toggle);
    card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    list.appendChild(card);
  });
}

function renderFilters(){
  var f=document.getElementById('filters');
  f.hidden=!ds();
  document.getElementById('fCov').hidden=state.sport!=='tennis';
  document.getElementById('fCov').classList.toggle('on',state.cov);
  document.getElementById('fSoir').classList.toggle('on',state.soir);
  document.getElementById('fArr').value=state.arr;
  document.getElementById('metaLine').hidden=!ds();
}

function rebuildArrOptions(){
  var D=ds(),fa=document.getElementById('fArr');
  fa.length=1;
  if(!D)return;
  var arrs={};
  D.days.forEach(function(d){(D.slots[d]||[]).forEach(function(s){arrs[D.sites[s.s].arr]=1;});});
  Object.keys(arrs).map(Number).sort(function(a,b){return a-b;}).forEach(function(a){
    var o=document.createElement('option');o.value=String(a);
    o.textContent=a>0&&a<=20?a+'ᵉ arr.':'Hors Paris';fa.appendChild(o);
  });
  if(state.arr!==''&&!arrs[state.arr])state.arr='';
}

function renderTabs(){
  ['tennis','padel','foot'].forEach(function(sp){
    var c=document.getElementById('cnt-'+sp);
    c.textContent=DS[sp]?DS[sp].total.toLocaleString('fr-FR')+' créneaux':(sp==='foot'?'—':'bientôt');
  });
  document.querySelectorAll('.tab').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-sport')===state.sport);
  });
}

function render(){applyAccent();renderMaj();renderHero();renderDays();renderFilters();renderList();renderTabs();persist();}

function switchSport(sp){
  if(sp===state.sport)return;
  state.sport=sp;state.arr='';state.open=null;
  var D=ds();
  state.day=D?(D.days.find(function(day){return (D.slots[day]||[]).length>0;})||D.days[0]):null;
  rebuildArrOptions();render();
}

document.getElementById('fArr').addEventListener('change',function(){state.arr=this.value;state.open=null;render();});
document.getElementById('fCov').addEventListener('click',function(){state.cov=!state.cov;render();});
document.getElementById('fSoir').addEventListener('click',function(){state.soir=!state.soir;render();});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){switchSport(b.getAttribute('data-sport'));});
});

function loadJSON(path){return fetch(path,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

if('serviceWorker' in navigator){
  try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
}

Promise.all([loadJSON('data.json'),loadJSON('padel.json'),loadJSON('foot.json')]).then(function(res){
  DS.tennis=res[0];DS.padel=res[1];DS.foot=res[2];
  if(!DS[state.sport]&&state.sport!=='foot')state.sport='tennis';
  var D=ds();
  state.day=D?(D.days.find(function(day){return (D.slots[day]||[]).length>0;})||D.days[0]):null;
  rebuildArrOptions();
  render();
});
})();
</script>
</body></html>
